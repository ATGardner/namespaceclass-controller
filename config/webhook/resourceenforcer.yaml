# Hand-authored, not controller-gen output: this webhook spans arbitrary
# resource kinds (whatever a NamespaceClass templates), scoped by the
# namespaceclass.akuity.io/parent label rather than a fixed set of
# group/version/resource entries. The +kubebuilder:webhook marker used for
# manifests.yaml has no field for objectSelector, which is what makes the
# wildcard rule below safe to use, so this config can't be generated by
# `make manifests` and must be kept here manually. See internal/webhook/enforcer.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: resourceenforcer-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-namespaceclass-managed-resources
  failurePolicy: Ignore
  name: menforcer.namespaceclass.akuity.io
  objectSelector:
    matchExpressions:
    - key: namespaceclass.akuity.io/parent
      operator: Exists
  rules:
  - apiGroups:
    - "*"
    apiVersions:
    - "*"
    operations:
    - UPDATE
    resources:
    - "*/*"
  sideEffects: None
