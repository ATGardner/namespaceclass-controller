---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-namespaceclass-akuity-io-v1alpha1-namespaceclass
  failurePolicy: Fail
  name: vnamespaceclass-v1alpha1.kb.io
  rules:
  - apiGroups:
    - namespaceclass.akuity.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - namespaceclasses
  sideEffects: None
