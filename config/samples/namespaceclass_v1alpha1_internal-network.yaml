apiVersion: namespaceclass.akuity.io/v1alpha1
kind: NamespaceClass
metadata:
  labels:
    app.kubernetes.io/name: namespaceclass-controller
    app.kubernetes.io/managed-by: kustomize
  name: internal-network
spec:
  resources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: restrict-to-corporate-vpn
    spec:
      podSelector: {}
      policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - ipBlock:
            cidr: 10.8.0.0/16 # placeholder: replace with your corporate VPN's actual address range
      egress:
      - to:
        - ipBlock:
            cidr: 10.8.0.0/16 # placeholder: replace with your corporate VPN's actual address range
