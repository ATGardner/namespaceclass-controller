apiVersion: namespaceclass.akuity.io/v1alpha1
kind: NamespaceClass
metadata:
  labels:
    app.kubernetes.io/name: namespaceclass-controller
    app.kubernetes.io/managed-by: kustomize
  name: class1
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: class1-name
      data:
        foo: asd
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: class1-name2
      data:
        foo: bar
        asd: qwe
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: class1-sa
